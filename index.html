<style>
  :root{
    --bg:#F6F5FF;
    --surface:#FFFFFF;
    --ink:#14122E;
    --ink-soft:#6B6A85;
    --primary:#6D3AF0;
    --primary-dark:#4B24C9;
    --primary-tint:#EFEAFE;
    --navy:#12143A;
    --navy-2:#1B1E52;
    --gold:#F59E0B;
    --pass:#17B26A;
    --warn:#F59E0B;
    --fail:#EF4444;
    --border:#E8E6F5;
    --radius:20px;
    --field-bg:#FAF9FF;
    --focus:rgba(109,58,240,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  h1,h2,h3,.display{ font-family:'Manrope',sans-serif; letter-spacing:-0.01em; }
  .mono{ font-family:'Manrope',sans-serif; }

  header.top{
    background:linear-gradient(160deg,var(--primary-dark),var(--primary));
    color:#fff; padding:24px 20px 20px; position:relative;
    box-shadow:0 2px 10px rgba(60,30,150,0.18);
  }
  header.top .eyebrow{
    font-family:'Manrope',sans-serif; font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; opacity:.7; margin:0 0 5px;
  }
  header.top h1{ font-size:23px; margin:0 0 3px; font-weight:600; }
  header.top .sub{ font-size:12.5px; opacity:.8; letter-spacing:.01em; }
  .menu-btn{
    position:absolute; top:22px; right:20px; width:34px; height:34px;
    background:rgba(255,255,255,0.12); border:none; border-radius:9px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    cursor:pointer; padding:0;
  }
  .menu-btn span{ display:block; width:16px; height:2px; background:#fff; border-radius:2px; }
  .settings-back{ background:none; border:none; color:var(--primary); font-family:'Manrope',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; padding:0; margin-bottom:10px; }
  .settings-page-title{ font-family:'Manrope',sans-serif; font-size:19px; font-weight:700; margin:0 0 14px; color:var(--ink); }
  .user-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .user-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:11px 12px;
    cursor:pointer; font-family:'Manrope',sans-serif; color:var(--ink); -webkit-appearance:none; appearance:none;
    -webkit-tap-highlight-color:transparent;
  }
  .user-row:active{ background:var(--primary-tint); }
  .user-avatar{
    width:34px; height:34px; border-radius:50%; background:var(--primary); color:#fff; flex-shrink:0;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .user-row-name{ flex:1; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-row-chevron{ font-size:22px; color:var(--ink-soft); line-height:1; }
  body.dark .btn-danger{ background:#4A1F2A; }
  .profile-card{ display:flex; align-items:center; gap:16px; text-align:left; }
  .profile-info{ min-width:0; flex:1; }
  .profile-avatar{
    width:104px; height:104px; border-radius:50%; margin:4px auto 12px; overflow:hidden;
    background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:40px;
    box-shadow:0 2px 10px rgba(60,30,150,0.22);
  }
  .profile-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .profile-card .profile-avatar{ width:84px; height:84px; font-size:32px; margin:0; flex-shrink:0; }
  .profile-name{ font-family:'Manrope',sans-serif; font-size:19px; font-weight:700; color:var(--ink); }
  .profile-position{ font-size:13px; color:var(--ink-soft); margin-top:3px; }
  .profile-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .settings-photo-row{ display:flex; align-items:center; gap:16px; }
  .settings-avatar{ width:76px; height:76px; font-size:30px; margin:0; flex-shrink:0; }
  .settings-photo-actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .add-store-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:12px; }
  .store-list{ display:flex; flex-direction:column; gap:8px; }
  .store-row{ display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .store-row-name{ flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .store-remove{ background:none; border:none; color:var(--fail); font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 2px; }
  .btn-logout{ background:var(--fail); color:#fff; margin-top:6px; padding:13px 16px; box-shadow:0 2px 8px rgba(192,57,43,0.28); }
  .btn-logout:active{ background:#9E2E22; }

  nav.steps{
    display:flex; gap:6px; padding:10px 12px; overflow-x:auto;
    background:var(--primary-dark);
    position:sticky; top:0; z-index:30; box-shadow:0 3px 10px rgba(60,30,150,0.18);
  }
  nav.steps button{
    flex:1; min-width:0; background:transparent; border:none; color:#A9C4E0;
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:600;
    padding:9px 4px; cursor:pointer; border-radius:8px; white-space:nowrap;
    transition:background .12s ease, color .12s ease;
  }
  nav.steps button.active{ color:#fff; background:rgba(255,255,255,0.16); }

  main{ max-width:640px; margin:0 auto; padding:20px 14px 40px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(60,30,150,0.04), 0 4px 14px rgba(60,30,150,0.045);
  }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=email], .field input[type=password], .field textarea, .field select{
    width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:9px;
    font-family:'Manrope',sans-serif; font-size:14px; color:var(--ink); background:#fbfcfb;
    height:42px; box-sizing:border-box; line-height:1.2; -webkit-appearance:none; appearance:none;
  }
  .field textarea{ height:auto; }
  .field input[type=date]{ font-size:13.5px; }
  .field textarea{ resize:vertical; min-height:56px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:10px; border:none; cursor:pointer;
    font-family:'Manrope',sans-serif; font-weight:600; font-size:13.5px;
    transition:background .12s ease, opacity .12s ease;
  }
  .btn-primary{ background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(109,58,240,0.32); }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-ghost{ background:var(--primary-tint); color:var(--primary-dark); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--ink-soft); }
  .btn-danger{ background:#FEE8E8; color:var(--fail); }
  .btn-sm{ padding:8px 13px; min-height:36px; font-size:12.5px; border-radius:9px; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

  .cat-header{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cat-title{ font-size:15px; font-weight:700; }
  .weight-chip{
    font-family:'Manrope',sans-serif; font-size:11px; background:var(--primary-tint);
    color:var(--primary-dark); padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .subcat{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .subcat-name{ font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }

  .item-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid #F0EEFA; }
  .item-row:last-child{ border-bottom:none; }
  .item-name{ font-size:13.5px; line-height:1.4; flex:1; font-weight:500; }
  .item-max{ color:var(--ink-soft); font-size:11.5px; font-weight:400; }
  .stepper{ display:flex; align-items:center; gap:5px; flex-shrink:0; background:#F3F0FF; border-radius:9px; padding:3px; }
  .stepper button{
    width:26px; height:26px; border-radius:7px; border:none;
    background:#fff; font-size:15px; font-weight:700; color:var(--primary-dark); cursor:pointer;
    box-shadow:0 1px 2px rgba(60,30,150,0.12);
  }
  .stepper button:active{ background:var(--primary-tint); }
  .stepper .val{ width:30px; text-align:center; font-family:'Manrope',sans-serif; font-weight:600; font-size:13.5px; }
  .note-toggle{ background:none; border:none; color:var(--primary); font-size:11px; cursor:pointer; padding:0; margin-top:4px; text-decoration:underline; }
  .note-box{ margin-top:6px; }
  .note-box textarea{ font-size:12.5px; }
  .item-actions{ display:flex; gap:8px; margin-top:7px; flex-wrap:wrap; }
  .chip-btn{
    display:inline-flex; align-items:center; gap:5px; background:var(--primary-tint); color:var(--primary-dark);
    border:1px solid transparent; border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:600;
    font-family:'Manrope',sans-serif; cursor:pointer; transition:background .12s ease;
  }
  .chip-btn:active{ background:#E2D8FD; }
  .chip-btn.filled{ background:var(--primary); color:#fff; }
  .chip-btn .chip-icon{ font-size:12px; line-height:1; }
  .photo-strip{ display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .photo-thumb{ position:relative; width:54px; height:54px; border-radius:9px; overflow:hidden; border:1px solid var(--border); flex-shrink:0; }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .rm{
    position:absolute; top:-4px; right:-4px; width:20px; height:20px; border-radius:50%; background:var(--fail); color:#fff;
    border:2px solid var(--surface); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .photo-thumb .rm svg{ width:8px; height:8px; }
  .photo-thumb.readonly .rm{ display:none; }
  .photo-uploading{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

  .add-line{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:10px; padding:11px;
    background:transparent; border:1.5px dashed var(--border); border-radius:10px; color:var(--primary);
    font-family:'Manrope',sans-serif; font-size:13px; font-weight:600; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .add-line:active{ background:var(--primary-tint); }

  .result-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .result-store{ font-family:'Manrope',sans-serif; font-size:17px; font-weight:700; color:var(--ink); line-height:1.3; }
  .result-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; padding:4px 0 6px; }
  .gauge-ring-wrap{ position:relative; width:180px; height:180px; }
  .gauge-ring-wrap svg{ display:block; }
  .gauge-ring-wrap circle{ transition:stroke-dasharray .4s ease; }
  .gauge-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .gauge-score{ font-family:'Manrope',sans-serif; font-size:34px; font-weight:700; color:var(--ink); line-height:1; }
  .gauge-pct-sign{ font-size:18px; font-weight:600; color:var(--ink-soft); }
  .gauge-label{ font-size:11px; color:var(--ink-soft); font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-top:4px; }
  .rating-badge{
    display:inline-block; padding:5px 13px; border-radius:20px; flex-shrink:0;
    font-size:12px; font-weight:700; font-family:'Manrope',sans-serif;
  }
  .result-stats{ display:flex; border-top:1px solid var(--border); margin-top:16px; padding-top:14px; }
  .result-stat{ flex:1; text-align:center; }
  .result-stat-num{ font-family:'Manrope',sans-serif; font-size:19px; font-weight:700; color:var(--ink); }
  .result-stat-label{ font-size:10.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-top:3px; }

  .cat-bar-row{ margin-bottom:10px; }
  .cat-bar-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .cat-bar-top .name{ font-weight:600; }
  .cat-bar-top .pct{ font-family:'Manrope',sans-serif; font-weight:600; }
  .cat-bar-track{ height:8px; background:#ECE8FB; border-radius:6px; overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:6px; }

  .flag-item{ padding:8px 0; border-bottom:1px solid #F0F3F1; }
  .flag-item:last-child{ border-bottom:none; }
  .flag-top{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; }
  .flag-score{ font-family:'Manrope',sans-serif; color:var(--fail); }
  .flag-note{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  canvas#sigPad{ width:100%; height:120px; border:1px solid var(--border); border-radius:10px; touch-action:none; background:#fff; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 10px; }
  .section-title{ font-size:14.5px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px; color:var(--ink); letter-spacing:-0.005em; }
  .helper{ font-size:11.5px; color:var(--ink-soft); margin-top:-4px; margin-bottom:10px; }
  .role-status{ font-size:12px; font-weight:600; padding:8px 10px; border-radius:9px; margin-top:2px; }
  .role-status.locked{ background:#FEE8E8; color:var(--fail); }
  .role-status.unlocked{ background:#E3F8EE; color:var(--pass); }

  .item-tap-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 2px; border-bottom:1px solid #F0EEFA; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .item-tap-row:last-child{ border-bottom:none; }
  .item-tap-row:active{ background:#F6F3FF; }
  .item-tap-main{ flex:1; min-width:0; }
  .item-tap-name{ font-size:13.5px; font-weight:500; line-height:1.4; }
  .item-tap-meta{ display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .meta-chip{ font-size:10.5px; font-weight:600; color:var(--ink-soft); background:#F1EEFC; padding:2px 7px; border-radius:6px; }
  .score-pill{ font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:7px 13px; border-radius:20px; flex-shrink:0; min-width:48px; text-align:center; }
  .score-pill.full{ background:#E3F8EE; color:var(--pass); }
  .score-pill.partial{ background:#FEF3DC; color:var(--warn); }
  .score-pill.fail{ background:#FEE8E8; color:var(--fail); }
  .score-pill.unscored{ background:transparent; border:1.5px dashed var(--border); color:var(--ink-soft); }
  .score-pill.missing{ background:#FEE8E8; border:1.5px solid transparent; color:var(--fail); }
  .score-pill.na{ background:#E4EEFF; color:#3B82F6; }
  .chip-btn.na-active{ background:#E4EEFF; color:#3B82F6; }


  .modal-overlay{ position:fixed; inset:0; background:rgba(15,24,32,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:60; }
  .modal-sheet{ background:#fff; width:100%; max-width:640px; border-radius:20px 20px 0 0; padding:14px 18px 22px; max-height:90vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(15,24,32,0.25); }
  .modal-handle{ width:38px; height:4px; background:var(--border); border-radius:3px; margin:2px auto 14px; }
  .modal-title{ font-family:'Manrope',sans-serif; font-size:16.5px; font-weight:700; margin-bottom:3px; padding-right:24px; }
  .modal-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .score-tier-row{ display:flex; gap:9px; margin-bottom:6px; }
  .score-tier-btn{ flex:1; padding:14px 6px; border-radius:14px; border:2px solid var(--border); background:#fff; text-align:center; cursor:pointer; }
  .score-tier-btn .tier-value{ font-family:'Manrope',sans-serif; font-size:21px; font-weight:700; color:var(--ink); }
  .score-tier-btn .tier-label{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:3px; }
  .score-tier-btn.selected{ border-color:var(--primary); background:var(--primary-tint); }
  .score-tier-btn.selected .tier-value{ color:var(--primary-dark); }
  .modal-section-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 7px; }
  .modal-note-area{ width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:9px; font-family:'Manrope',sans-serif; font-size:13.5px; resize:vertical; min-height:64px; background:#fbfcfb; box-sizing:border-box; }
  .modal-close-x{
    position:absolute; top:12px; right:14px; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    background:var(--bg); border:none; border-radius:50%; color:var(--ink-soft); cursor:pointer; padding:0;
  }
  .modal-close-x svg{ width:13px; height:13px; }
  .sticky-cta{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    padding:10px 14px; display:flex; gap:8px; justify-content:center; z-index:10;
  }
  .sticky-cta .inner{ max-width:640px; width:100%; display:flex; gap:8px; }
  .total-weight-note{ font-size:11.5px; margin-top:4px; }
  .warn-text{ color:var(--warn); }
  .ok-text{ color:var(--pass); }

  /* ---------- Focus + motion polish ---------- */
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--primary) !important; box-shadow:0 0 0 3px var(--focus); }
  .btn:active{ transform:scale(.985); }
  @keyframes pageIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .page-enter{ animation:pageIn .22s ease both; }
  @media (prefers-reduced-motion: reduce){ .page-enter{ animation:none; } .btn:active{ transform:none; } }

  /* ---------- Checklist editor ---------- */
  .ck-input{
    width:100%; min-width:0; height:42px; padding:0 12px; border:1px solid var(--border); border-radius:10px;
    background:var(--field-bg); color:var(--ink); font-family:'Manrope',sans-serif; font-size:14px;
  }
  .ck-cat-head, .ck-sub-head, .ck-item-top{ display:flex; align-items:center; gap:8px; }
  .ck-cat-name{ font-family:'Manrope',sans-serif; font-size:16px; font-weight:700; height:46px; }
  .ck-weight{
    display:inline-flex; align-items:center; gap:6px; margin:10px 0 2px; padding:4px 10px; border-radius:20px;
    background:var(--primary-tint); color:var(--primary-dark); font-size:11.5px; font-weight:600;
  }
  .ck-weight b{ font-family:'Manrope',sans-serif; font-weight:600; }
  .ck-sub{ margin-top:14px; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:14px; }
  .ck-sub-name{ font-weight:700; }
  .ck-item{ margin-top:10px; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .ck-scores{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .ck-score{ display:block; }
  .ck-score span{ display:block; text-align:center; margin-bottom:4px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .ck-score.full span{ color:var(--pass); }
  .ck-score.partial span{ color:var(--warn); }
  .ck-score.fail span{ color:var(--fail); }
  .ck-score input{ text-align:center; height:38px; padding:0 4px; font-family:'Manrope',sans-serif; font-weight:600; font-size:15px; }
  .ck-stats{ display:flex; gap:8px; margin-top:12px; }
  .ck-stat{ flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:9px 6px; text-align:center; }
  .ck-stat b{ display:block; font-family:'Manrope',sans-serif; font-size:17px; color:var(--ink); }
  .ck-stat span{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .icon-del{
    flex-shrink:0; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
    border:none; border-radius:10px; background:#FEE8E8; color:var(--fail); cursor:pointer; padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .icon-del:active{ background:#F5D3CE; }
  .icon-del.sm{ width:32px; height:32px; border-radius:9px; }
  .icon-del svg{ width:14px; height:14px; }
  .tier-mini-row{ display:flex; gap:4px; flex-shrink:0; }
  .tier-mini{ font-family:'Manrope',sans-serif; font-weight:600; font-size:11.5px; min-width:28px; text-align:center; padding:3px 6px; border-radius:6px; }
  .tier-mini.full{ background:#E3F8EE; color:var(--pass); }
  .tier-mini.partial{ background:#FEF3DC; color:var(--warn); }
  .tier-mini.fail{ background:#FEE8E8; color:var(--fail); }

  /* ---------- Audit progress ---------- */
  .progress-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .progress-count{ font-family:'Manrope',sans-serif; font-size:13px; font-weight:600; color:var(--primary); }
  .cat-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Login ---------- */
  .login-logo{ display:block; width:68px; height:68px; margin:0 auto 12px; border-radius:16px; box-shadow:0 4px 14px rgba(60,30,150,0.25); }
  .login-card .section-title{ justify-content:center; }
  .login-card .helper{ text-align:center; margin-top:-6px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:66px !important; }
  .pw-toggle{
    position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--primary);
    font-family:'Manrope',sans-serif; font-weight:600; font-size:12.5px; padding:10px; cursor:pointer;
  }

  /* iPhone Safari zooms into any box whose text is under 16px, so keep every form control at 16px */
  input, select, textarea,
  .field input, .field select, .field textarea,
  .field input[type=date], .ck-input, .ck-score input, .modal-note-area, .note-box textarea{
    font-size:16px !important;
  }

  /* ---------- Photo cropper ---------- */
  .crop-box{
    position:relative; overflow:hidden; margin:4px auto 0; background:#0E141A; border-radius:16px;
    touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; isolation:isolate;
  }
  .crop-box:active{ cursor:grabbing; }
  .crop-box img{ position:absolute; left:0; top:0; max-width:none; transform-origin:0 0; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .crop-mask{
    position:absolute; top:0; left:0; right:0; bottom:0; box-sizing:border-box; border-radius:50%;
    border:2px solid rgba(255,255,255,0.92); box-shadow:0 0 0 999px rgba(8,12,16,0.58); pointer-events:none;
  }
  .crop-zoom{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .crop-zoom span{ font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .crop-zoom input{ flex:1; accent-color:var(--primary); }
  input[type=range]:focus{ box-shadow:none; }

  /* ---------- Stop iPhone from zooming in when you tap a text box ---------- */
  input, select, textarea{ font-size:16px !important; }
  html, body{ touch-action:manipulation; }

  /* ---------- Stores in Profile + store page ---------- */
  .row-main{ flex:1; min-width:0; text-align:left; }
  .row-title{ display:block; font-size:14.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-sub{ display:block; font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:400; }
  .mini-score{ font-family:'Manrope',sans-serif; font-weight:700; font-size:12.5px; padding:4px 9px; border-radius:8px; flex-shrink:0; }
  .store-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-chip{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .back-chip svg{ width:16px; height:16px; }
  .store-title{ flex:1; min-width:0; margin:0; font-family:'Manrope',sans-serif; font-size:18px; font-weight:700; color:var(--ink); line-height:1.25; }
  .btn-audit{
    flex-shrink:0; height:40px; padding:0 22px; border:none; border-radius:12px; background:#EC4899; color:#fff;
    font-family:'Manrope',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    box-shadow:0 2px 8px rgba(236,72,153,0.32); -webkit-tap-highlight-color:transparent;
  }
  .btn-audit:active{ background:#C73082; transform:scale(.985); }
  .title-note{ font-weight:500; color:var(--ink-soft); font-size:12.5px; }
  .info-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .info-tile{ background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center; }
  .info-tile-label{ font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .info-tile-value{ font-family:'Manrope',sans-serif; font-size:26px; font-weight:700; color:var(--ink); margin-top:6px; line-height:1.1; }
  .info-tile-sub{ font-size:12.5px; font-weight:600; margin-top:4px; }
  .report-list{ display:flex; flex-direction:column; }
  .report-row{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
  .report-row:last-child{ border-bottom:none; padding-bottom:2px; }
  .report-row:first-child{ padding-top:2px; }
  .report-main{ flex:1; min-width:0; }
  .report-date{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .report-sep{ color:var(--ink-soft); font-weight:400; }
  .report-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .report-badge{ flex-shrink:0; min-width:66px; text-align:center; padding:11px 10px; border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:16px; }

  /* ---------- Visit information ---------- */
  .seg{ display:grid; gap:8px; }
  .seg.cols3{ grid-template-columns:repeat(3,1fr); }
  .seg-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:46px; padding:9px 6px;
    background:var(--field-bg); border:1.5px solid var(--border); border-radius:12px; color:var(--ink);
    font-family:'Manrope',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .seg-btn:active{ transform:scale(.985); }
  .seg-btn.on{ border-color:var(--primary); background:var(--primary-tint); color:var(--primary-dark); }
  body.dark .seg-btn.on{ color:#D3C6FF; }
  .w-ico{ display:inline-flex; }
  .w-ico svg{ width:15px; height:15px; }
  .seg-btn .w-ico svg{ width:26px; height:26px; }
  .w-sun{ color:#E3A008; }
  .w-cloud{ color:#7C8B99; }
  .w-rain{ color:#3B82C4; }
  .visit-chips{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 14px; }
  .visit-chip{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px;
    background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:600; color:var(--ink-soft);
  }
  .visit-edit{
    display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px; border:1px solid transparent;
    background:linear-gradient(135deg,#7C4DFF,#5B2FE0); color:#fff; font-family:'Manrope',sans-serif;
    font-size:12px; font-weight:600; line-height:normal; cursor:pointer;
  }
  body.dark .visit-edit{ color:#fff; }

  /* ---------- Review a saved report ---------- */
  button.report-row{
    width:100%; background:none; border:none; border-bottom:1px solid var(--border); text-align:left;
    font-family:inherit; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent;
  }
  button.report-row:active{ background:var(--primary-tint); }
  .report-chevron{ font-size:22px; color:var(--ink-soft); line-height:1; flex-shrink:0; }
  .seg.cols2{ grid-template-columns:repeat(2,1fr); }
  .rv-item{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }

  /* ================= Animations ================= */
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px) scale(.985);} to{opacity:1; transform:none;} }

  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:none;} }
  @keyframes popIn{ 0%{transform:scale(.6); opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;} }

  @keyframes shimmer{ 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
    @keyframes headerGlow{ 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
  @keyframes pulseRing{ 0%{box-shadow:0 0 0 0 rgba(109,58,240,.45);} 100%{box-shadow:0 0 0 14px rgba(109,58,240,0);} }

  .page-enter > *{ animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }

  @media (prefers-reduced-motion: reduce){

  /* ---------- fonts: Outfit for headings/numbers/buttons, Manrope for text ---------- */

  /* ---------- removed unnecessary pop-in animations ---------- */

  .cat-bar-fill, .btn-audit{ animation:none !important; }
  .score-tier-btn.selected{ box-shadow:0 0 0 3px rgba(109,58,240,0.14); }

  /* ================= v2 tweaks: plain tab bar, no bottom gap, PDF + report list ================= */

<body>

<header class="top">
  <button class="menu-btn" id="menuBtn" onclick="toggleSettings()" aria-label="Settings">
    <span></span><span></span><span></span>
  </button>
  <h1>Audit</h1>
  <div class="sub" id="headerSub"></div>
</header>

<nav class="steps" id="stepNav"></nav>

<main id="content"></main>
<div id="modalRoot"></div>
<div id="userModalRoot"></div>
<div id="cropModalRoot"></div>
<div id="confirmModalRoot"></div>
<div id="pdfModalRoot"></div>
<div id="lightboxRoot"></div>

<script>
/* ---------------- STATE ---------------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function todayLocal(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
const WEATHER_ICONS = {
  Sunny:  { cls:'w-sun',   svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>' },
  Cloudy: { cls:'w-cloud', svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>' },
  Rainy:  { cls:'w-rain',  svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><path d="M8 13v8M12 15v8M16 13v8"/></svg>' }
};
function weatherIcon(name){
  const w = WEATHER_ICONS[name];
  return w ? '<span class="w-ico ' + w.cls + '">' + w.svg + '</span>' : '';
}
function visitTimeText(a, b){
  if(a && b) return a + ' – ' + b;
  if(a) return 'In ' + a;
  if(b) return 'Out ' + b;
  return '';
}
/* small summary of the visit information (shown on the Audit and Report pages) */
function visitSummaryHTML(editable, src){
  const v = src || auditInfo;
  const chips = [];
  if(v.date) chips.push('<span class="visit-chip">' + esc(v.date) + '</span>');
  const t = visitTimeText(v.timeIn, v.timeOut);
  if(t) chips.push('<span class="visit-chip">' + esc(t) + '</span>');
  if(v.traffic) chips.push('<span class="visit-chip">Traffic: ' + esc(v.traffic) + '</span>');
  if(v.weather) chips.push('<span class="visit-chip">' + weatherIcon(v.weather) + esc(v.weather) + '</span>');
  if(editable) chips.push('<button class="visit-edit" onclick="goStep(\'visit\')">Edit</button>');
  return chips.length ? '<div class="visit-chips">' + chips.join('') + '</div>' : '';
}
const ICON_X = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function pageEnter(){
  const c = document.getElementById('content');
  if(!c || !c.classList || !c.classList.remove || !c.classList.add) return;

/* ---------- Profile picture: pick a photo, then crop it yourself ---------- */
let cropState = null;

/* Shrink very large phone photos first (keeps the cropper fast); also applies the photo's rotation */
function prepareCropSource(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1600;
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: c.toDataURL('image/jpeg', 0.92), w, h });
      };
      img.onerror = ()=>reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
function setProfilePhoto(dataUrl){
  if(isManager()){ adminProfile.photo = dataUrl; saveAdminProfile(); }
  else if(loggedInUser){
    const a = auditorAccounts.find(x=>x.id === loggedInUser.accountId);
    if(a){ a.photo = dataUrl; saveAccountsToStorage(); }
  }
}
async function handleProfilePhoto(event){
  const input = event.target;
  const file = input.files && input.files[0];
  if(!file) return;
  try{ openCropper(await prepareCropSource(file)); }
  catch(err){ alert('Could not use that photo: ' + err.message); }
  input.value = '';
}
function removeProfilePhoto(){ setProfilePhoto(''); render(); }

function openCropper(src){
  const vw = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 360;
  const box = Math.max(200, Math.min(320, vw - 72));
  const minScale = Math.max(box / src.w, box / src.h);
  cropState = {
    src, box, natW: src.w, natH: src.h,
    minScale, maxScale: minScale * 4, scale: minScale,
    x: (box - src.w * minScale) / 2, y: (box - src.h * minScale) / 2
  };
  renderCropper();
}
function closeCropper(){
  cropState = null;
  const root = document.getElementById('cropModalRoot');
  if(root) root.innerHTML = '';
}
/* keep the picture always covering the crop square */
function cropClamp(){
  const s = cropState; if(!s) return;
  const w = s.natW * s.scale, h = s.natH * s.scale;
  s.x = Math.min(0, Math.max(s.box - w, s.x));
  s.y = Math.min(0, Math.max(s.box - h, s.y));
}
/* zoom while keeping the point (px,py) under the finger / centre fixed */
function cropZoomAt(px, py, newScale){
  const s = cropState; if(!s) return;
  newScale = Math.min(s.maxScale, Math.max(s.minScale, newScale));
  const u = (px - s.x) / s.scale, v = (py - s.y) / s.scale;
  s.scale = newScale;
  s.x = px - u * newScale;
  s.y = py - v * newScale;
}
function applyCrop(){
  const s = cropState; if(!s) return;
  const img = document.getElementById('cropImg');
  const z = document.getElementById('cropZoom');
  if(img && img.style) img.style.transform = `translate(${s.x}px, ${s.y}px) scale(${s.scale})`;
  if(z) z.value = s.scale / s.minScale;
}
function renderCropper(){
  const root = document.getElementById('cropModalRoot');
  const s = cropState;
  if(!root || !s) return;
  root.innerHTML = `
  <div class="modal-overlay">
    <div class="modal-sheet" style="position:relative;">
      <div class="modal-handle"></div>
      <div class="modal-title">Crop Photo</div>
      <div class="modal-sub">Drag to move. Pinch or use the slider to zoom.</div>
      <div class="crop-box" id="cropBox" style="width:${s.box}px; height:${s.box}px;">
        <img id="cropImg" src="${s.src.dataUrl}" alt="" draggable="false" style="width:${s.natW}px; height:${s.natH}px;">
        <div class="crop-mask"></div>
      </div>
      <div class="crop-zoom"><span>Zoom</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" onclick="saveCrop()">Save Photo</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline btn-block" onclick="closeCropper()">Cancel</button>
      </div>
    </div>
  </div>`;
  applyCrop();
  setupCropGestures();
}
function setupCropGestures(){
  const boxEl = document.getElementById('cropBox');
  const zoomEl = document.getElementById('cropZoom');
  if(!boxEl || !boxEl.addEventListener) return;
  const pts = new Map();
  let pinch = null;
  const point = e => { const r = boxEl.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;

  boxEl.addEventListener('pointerdown', e=>{
    if(!cropState) return;
    if(boxEl.setPointerCapture){ try{ boxEl.setPointerCapture(e.pointerId); }catch(err){} }
    pts.set(e.pointerId, point(e));
    if(pts.size === 2){
      const [a, b] = [...pts.values()];
      pinch = { d: dist(a, b), s: cropState.scale };
    }
    e.preventDefault();
  });
  boxEl.addEventListener('pointermove', e=>{
    if(!cropState || !pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId), cur = point(e);
    pts.set(e.pointerId, cur);
    if(pts.size === 1){
      cropState.x += cur.x - prev.x;
      cropState.y += cur.y - prev.y;
    } else if(pts.size === 2 && pinch){
      const [a, b] = [...pts.values()];
      cropZoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.s * dist(a, b) / pinch.d);
    }
    cropClamp(); applyCrop();
    e.preventDefault();
  });
  const end = e=>{ pts.delete(e.pointerId); if(pts.size < 2) pinch = null; };
  boxEl.addEventListener('pointerup', end);
  boxEl.addEventListener('pointercancel', end);
  boxEl.addEventListener('wheel', e=>{
    if(!cropState) return;
    e.preventDefault();
    const p = point(e);
    cropZoomAt(p.x, p.y, cropState.scale * (e.deltaY < 0 ? 1.08 : 1 / 1.08));
    cropClamp(); applyCrop();
  }, { passive: false });
  if(zoomEl && zoomEl.addEventListener){
    zoomEl.addEventListener('input', ()=>{
      if(!cropState) return;
      cropZoomAt(cropState.box / 2, cropState.box / 2, cropState.minScale * parseFloat(zoomEl.value));
      cropClamp(); applyCrop();
    });
  }
}
function saveCrop(){
  const s = cropState; if(!s) return;
  const img = document.getElementById('cropImg');
  const OUT = 320;
  const c = document.createElement('canvas');
  c.width = OUT; c.height = OUT;
  const sw = s.box / s.scale;
  const sx = Math.max(0, Math.min(s.natW - sw, -s.x / s.scale));
  const sy = Math.max(0, Math.min(s.natH - sw, -s.y / s.scale));
  c.getContext('2d').drawImage(img, sx, sy, sw, sw, 0, 0, OUT, OUT);
  setProfilePhoto(c.toDataURL('image/jpeg', 0.86));
  closeCropper();
  render();
}

/* ---------------- SCORING ---------------- */
function computeScores(){
  const raw = checklist.map(cat=>{
    let structuralMax=0, scoredMax=0, scoredPoints=0;
    cat.subcategories.forEach(sc=> sc.items.forEach(it=>{
      if(it.na) return;
      const m = itemMax(it);
      structuralMax += m;
      if(it.score !== null && it.score !== undefined){
        scoredMax += m; scoredPoints += Number(it.score)||0;
      }
    }));
    return { id:cat.id, name:cat.name, structuralMax, scoredMax, scoredPoints };
  });
  const totalStructuralMax = raw.reduce((s,c)=>s+c.structuralMax,0) || 1;
  const catResults = raw.map(c=>{
    const weight = totalStructuralMax>0 ? (c.structuralMax/totalStructuralMax*100) : 0;
    const pct = c.scoredMax>0 ? (c.scoredPoints/c.scoredMax*100) : 100;
    return { id:c.id, name:c.name, weight, max:c.scoredMax, scored:c.scoredPoints, pct };
  });
  const overall = catResults.reduce((s,c)=> s + (c.pct * c.weight/100), 0);
  return { catResults, overall };
}

function ratingFor(pct){
  if(pct>=90) return {label:'Excellent', color:'var(--pass)', bg:'#E3F8EE'};
  if(pct>=85) return {label:'Needs Improvement', color:'var(--warn)', bg:'#FEF3DC'};
  return {label:'Unsatisfactory', color:'var(--fail)', bg:'#FEE8E8'};
}

function pad2(n){ return String(n).padStart(2, '0'); }
function fmtDate(d){ return d.getFullYear() + '/' + pad2(d.getMonth()+1) + '/' + pad2(d.getDate()); }
function fmtTime(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

/* reports of one store from the last N months, newest first */
function reportsForStore(name, months){
  const cutoff = new Date();
  cutoff.setHours(0, 0, 0, 0);
  cutoff.setMonth(cutoff.getMonth() - months);
  const key = String(name || '').toLowerCase();
  return reports
    .filter(r => r && String(r.store || '').toLowerCase() === key)
    .filter(r => {
      let t = new Date((r.date || '') + 'T00:00:00');
      if(isNaN(t)) t = new Date(r.savedAt);
      return !isNaN(t) && t >= cutoff;
    })
    .sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
}

function auditSignature(){
  const parts = [];
  checklist.forEach(c=>c.subcategories.forEach(s=>s.items.forEach(it=>{
    parts.push([it.id, it.score, it.na ? 1 : 0, it.note || '', (it.photos || []).length]);
  })));
  return JSON.stringify(parts);
}
function auditIsBlank(){
  return checklist.every(c=>c.subcategories.every(s=>s.items.every(it=>
    (it.score === null || it.score === undefined) && !it.na && !it.note && !(it.photos && it.photos.length))));
}
function hasUnsavedAudit(){ return !auditIsBlank() && auditSignature() !== lastSavedSignature; }
function resetAuditData(){
  checklist.forEach(c=>c.subcategories.forEach(s=>s.items.forEach(it=>{
    it.score = null; it.na = false; it.note = ''; it.photos = [];
  })));
}

/* A small confirm window (the phone's built-in confirm box is unreliable in the home-screen app) */
function askConfirm(title, message, yesLabel, onYes){
  const root = document.getElementById('confirmModalRoot');
  if(!root) return;
  pendingConfirm = onYes;
  root.innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) confirmNo()">
    <div class="modal-sheet" style="position:relative;">
      <div class="modal-handle"></div>
      <div class="modal-title">${esc(title)}</div>
      <div class="modal-sub" style="margin-bottom:18px;">${esc(message)}</div>
      <div class="btn-row"><button class="btn btn-danger btn-block" onclick="confirmYes()">${esc(yesLabel)}</button></div>
      <div class="btn-row"><button class="btn btn-outline btn-block" onclick="confirmNo()">Cancel</button></div>
    </div>
  </div>`;
}
function closeConfirm(){
  pendingConfirm = null;
  const root = document.getElementById('confirmModalRoot');
  if(root) root.innerHTML = '';
}
function confirmYes(){ const fn = pendingConfirm; closeConfirm(); if(fn) fn(); }
function confirmNo(){ closeConfirm(); }

function openStore(id){
  activeStoreId = id;
  render(); pageEnter();
  window.scrollTo({top:0, behavior:'smooth'});
}
function startAudit(storeId){
  const store = stores.find(s=>s.id === storeId);
  if(!store) return;
  if(hasUnsavedAudit()){
    if(auditInfo.store === store.name){ goStep('audit'); return; }   // same store: carry on where you left off
    askConfirm('Start a new audit?',
      'You have an unsaved audit for ' + (auditInfo.store || 'another store') + '. Starting a new audit for ' + store.name + ' will discard it.',
      'Start new audit', ()=>beginAudit(store));
    return;
  }
  beginAudit(store);
}
function beginAudit(store){
  resetAuditData();
  auditInfo.store = store.name;
  auditInfo.date = todayLocal();
  auditInfo.timeIn = nowHM();
  auditInfo.timeOut = '';
  auditInfo.traffic = '';
  auditInfo.weather = '';
  auditInfo.reportId = null;
  showMissing = false;
  lastSavedSignature = auditSignature();
  goStep('visit');
}

function collectFlagged(){
  const flagged = [], notAvailable = [];
  checklist.forEach(cat=>cat.subcategories.forEach(sc=>sc.items.forEach(it=>{
    if(it.na){ notAvailable.push({cat:cat.name, name:it.name, note:it.note || ''}); return; }
    const m = itemMax(it);
    if(it.score !== null && it.score !== undefined && Number(it.score) < m){
      flagged.push({cat:cat.name, name:it.name, score:it.score, max:m, note:it.note || ''});
    }
  })));
  return { flagged, notAvailable };
}
/* every checklist item with its result, so a saved report can be reviewed in full */
function collectAllItems(){
  const out = [];
  checklist.forEach(cat=>cat.subcategories.forEach(sc=>sc.items.forEach(it=>{
    const t = itemTiers(it);
    out.push({
      id: it.id, cat: cat.name, sub: sc.name, name: it.name,
      max: itemMax(it), failAt: Number(t[2]) || 0,
      score: (it.score === undefined ? null : it.score), na: !!it.na,
      note: it.note || '', photos: (it.photos || []).length
    });
  })));
  return out;
}
function buildReportSnapshot(){
  const { catResults, overall } = computeScores();
  const { flagged, notAvailable } = collectFlagged();
  const snap = {
    store: auditInfo.store,
    date: auditInfo.date,
    savedAt: new Date().toISOString(),
    auditor: auditInfo.auditor || '',
    timeIn: auditInfo.timeIn || '', timeOut: auditInfo.timeOut || '',
    traffic: auditInfo.traffic || '', weather: auditInfo.weather || '',
    items: collectAllItems(),
    score: Number(overall.toFixed(1)),
    categories: catResults.map(c=>({ name:c.name, pct:Number(c.pct.toFixed(1)), weight:Number(c.weight.toFixed(1)), scored:c.scored, max:c.max })),
    flagged, notAvailable
  };
  // keep the signature with the report so the PDF can be made again later
  const sigEl = document.getElementById('sigPad');
  if(sigEl && sigHasDrawn){ try{ snap.signature = sigEl.toDataURL('image/png'); }catch(err){} }
  return snap;
}
/* ---------- Report photos live in the phone's photo database (too big for the normal storage) ---------- */
const PHOTO_DB_NAME = 'qc_audit_app_photos_v1';
function openPhotoDB(){
  return new Promise((resolve, reject)=>{
    try{
      const idb = window.indexedDB;
      if(!idb){ reject(new Error('Photo storage is not available')); return; }
      const req = idb.open(PHOTO_DB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('photos', { keyPath: 'key' }); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error || new Error('Could not open photo storage'));
      req.onblocked = ()=>reject(new Error('Photo storage is blocked'));
    }catch(err){ reject(err); }
  });
}
function photoKeyRange(reportId){
  const p = reportId + ':';
  return window.IDBKeyRange.bound(p, p + '\uffff');
}
async function persistReportPhotos(reportId){
  const entries = [];   // collected right away, before anything async
  checklist.forEach(c=>c.subcategories.forEach(s=>s.items.forEach(it=>{
    (it.photos || []).forEach((p, idx)=>{
      entries.push({ key: reportId + ':' + it.id + ':' + String(idx).padStart(3, '0'), reportId, itemId: it.id, idx, dataUrl: p.dataUrl });
    });
  })));
  const db = await openPhotoDB();
  await new Promise((resolve, reject)=>{
    const tx = db.transaction('photos', 'readwrite');
    const st = tx.objectStore('photos');
    st.delete(photoKeyRange(reportId));      // saving again replaces the old photos of this report
    entries.forEach(e=>st.put(e));
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  });
  if(db.close) db.close();
}
async function loadPhotosForReport(reportId){
  const db = await openPhotoDB();
  const rows = await new Promise((resolve, reject)=>{
    const tx = db.transaction('photos', 'readonly');
    const req = tx.objectStore('photos').getAll(photoKeyRange(reportId));
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  });
  if(db.close) db.close();
  const map = {};
  rows.sort((a, b)=> a.key < b.key ? -1 : 1).forEach(r=>{ (map[r.itemId] = map[r.itemId] || []).push(r.dataUrl); });
  return map;
}
async function deleteReportPhotos(reportId){
  const db = await openPhotoDB();
  await new Promise((resolve, reject)=>{
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').delete(photoKeyRange(reportId));
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  });
  if(db.close) db.close();
}

/* Every item must be answered: pick a score, or mark it Not Available. Otherwise the audit cannot be completed. */
let showMissing = false;     // after a blocked attempt, unanswered items are highlighted
function isItemAnswered(it){ return !!it.na || (it.score !== null && it.score !== undefined); }
function missingItems(){
  const out = [];
  checklist.forEach(c=>c.subcategories.forEach(s=>s.items.forEach(it=>{
    if(!isItemAnswered(it)) out.push({ id: it.id, cat: c.name, name: it.name });
  })));
  return out;
}
function auditIsComplete(){ return missingItems().length === 0; }
function incompleteMessage(){
  const n = missingItems().length;
  return n + (n === 1 ? ' item still needs' : ' items still need') + ' a score or N/A.';
}
function goToMissing(){
  showMissing = true;
  step = 'audit';
  render(); pageEnter();
  const first = (typeof document.querySelector === 'function') ? document.querySelector('.item-tap-row.missing') : null;
  if(first && first.scrollIntoView) first.scrollIntoView({ block:'center', behavior:'smooth' });
  else window.scrollTo({top:0, behavior:'smooth'});
}

function saveCurrentReport(){
  if(!auditInfo.store){
    return { ok:false, msg:'Choose a store first: open a store on the Profile tab and tap Audit.' };
  }
  if(!auditIsComplete()){
    return { ok:false, incomplete:true, msg:'Not complete: ' + incompleteMessage() };
  }
  const snap = buildReportSnapshot();
  let existing = auditInfo.reportId ? reports.find(r=>r.id === auditInfo.reportId) : null;
  if(existing && existing.store !== auditInfo.store) existing = null;   // never overwrite another store's report
  if(existing){ Object.assign(existing, snap); }
  else { snap.id = uid(); reports.push(snap); auditInfo.reportId = snap.id; }
  const ok = saveReportsToStorage();
  lastSavedSignature = auditSignature();
  persistReportPhotos(auditInfo.reportId).catch(err=>console.warn('Could not save report photos:', err));
  return ok ? { ok:true, msg:'Report saved.' } : { ok:false, msg:'Could not save: the phone storage is full.' };
}
function saveReportAndOpenStore(){
  const res = saveCurrentReport();
  const st = document.getElementById('saveStatus');
  if(!res.ok){
    if(res.incomplete) showMissing = true;
    if(st){ st.textContent = res.msg; st.style.color = 'var(--fail)'; }
    return;
  }
  showReportDone();
}
function finishAndOpenStore(){
  const root = document.getElementById('confirmModalRoot'); if(root) root.innerHTML = '';
  const store = stores.find(s=>s.name === auditInfo.store);
  activeStoreId = store ? store.id : null;
  step = 'profile'; previousStep = 'profile';
  render(); pageEnter();
  window.scrollTo({top:0, behavior:'smooth'});
}
function showReportDone(){
  const root = document.getElementById('confirmModalRoot'); if(!root) return finishAndOpenStore();
  root.innerHTML = `
  <div class="modal-overlay">
    <div class="modal-sheet" style="position:relative; text-align:center;">
      <div class="modal-handle"></div>
      <div class="done-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="modal-title" style="padding-right:0;">Audit complete</div>
      <div class="modal-sub">${esc(auditInfo.store || '')} has been saved. The report is saved in the store\u2019s list (kept for 5 months). Would you like the PDF now?</div>
      <button class="btn btn-primary btn-block" onclick="generatePDF()">Save PDF</button>
      <div class="btn-row"><button class="btn btn-outline btn-block" onclick="finishAndOpenStore()">Done</button></div>
    </div>
  </div>`;
}

/* ---------------- REVIEW A SAVED REPORT ---------------- */
let activeReportId = null;
let reviewFilter = 'all';          // all | flagged
let reviewPhotos = {};             // itemId -> [photo, ...] for the report being reviewed
let reviewPhotosState = 'loading'; // loading | done | failed

function openReport(id){
  if(!reports.some(r=>r.id === id)) return;
  activeReportId = id; reviewFilter = 'all'; reviewPhotos = {}; reviewPhotosState = 'loading';
  step = 'review';
  render(); pageEnter();
  window.scrollTo({top:0, behavior:'smooth'});
  loadPhotosForReport(id).then(map=>{
    if(activeReportId !== id) return;
    reviewPhotos = map; reviewPhotosState = 'done'; rerenderReview();
  }).catch(()=>{
    if(activeReportId !== id) return;
    reviewPhotosState = 'failed'; rerenderReview();
  });
}
function rerenderReview(){
  if(step !== 'review') return;
  const y = (typeof window.scrollY === 'number') ? window.scrollY : 0;
  render();
  window.scrollTo(0, y);
}
function setReviewFilter(f){ reviewFilter = f; rerenderReview(); }
function closeReview(){
  const rep = reports.find(r=>r.id === activeReportId);
  const store = rep ? stores.find(s=>s.name === rep.store) : null;
  activeReportId = null;
  closeLightbox();
  step = 'profile'; previousStep = 'profile';
  activeStoreId = store ? store.id : null;
  render(); pageEnter();
  window.scrollTo({top:0, behavior:'smooth'});
}
/* Only the Admin can delete a saved report (asks first, then removes the report and its photos) */
function requestDeleteReport(id){
  if(!isManager()) return;
  const rep = reports.find(r=>r.id === id);
  if(!rep) return;
  const d = new Date(rep.savedAt);
  askConfirm('Delete this report?',
    'This permanently deletes the ' + fmtDate(d) + ' ' + fmtTime(d) + ' report for ' + rep.store + ' (score ' + Number(rep.score).toFixed(1) + '), including its photos. This cannot be undone.',
    'Delete report', ()=>deleteReport(id));
}
function deleteReport(id){
  if(!isManager()) return;                      // QC Controllers can never delete
  const idx = reports.findIndex(r=>r.id === id);
  if(idx < 0) return;
  const rep = reports[idx];
  const store = stores.find(s=>s.name === rep.store);
  reports.splice(idx, 1);
  if(!saveReportsToStorage()){                  // could not write: put it back so nothing is half-deleted
    reports.splice(idx, 0, rep);
    alert('Could not delete the report. Please try again.');
    return;
  }
  deleteReportPhotos(id).catch(err=>console.warn('Could not delete report photos:', err));
  if(auditInfo.reportId === id) auditInfo.reportId = null;
  activeReportId = null; reviewPhotos = {};
  closeLightbox();
  step = 'profile'; previousStep = 'profile';
  activeStoreId = store ? store.id : null;
  render(); pageEnter();
  window.scrollTo({top:0, behavior:'smooth'});
}
function openReviewPhoto(itemId, idx){
  const arr = reviewPhotos[itemId];
  const root = document.getElementById('lightboxRoot');
  if(!arr || !arr[idx] || !root) return;
  root.innerHTML = `<div class="lightbox" onclick="closeLightbox()"><img src="${arr[idx]}" alt=""><button class="lightbox-x" aria-label="Close">${ICON_X}</button></div>`;
}
function closeLightbox(){
  const root = document.getElementById('lightboxRoot');
  if(root) root.innerHTML = '';
}

function reviewPill(it){
  if(it.na) return { cls:'na', text:'N/A' };
  if(it.score === null || it.score === undefined) return { cls:'unscored', text:'– –' };
  const failAt = (typeof it.failAt === 'number') ? it.failAt : 0;
  const cls = Number(it.score) >= it.max ? 'full' : (Number(it.score) <= failAt ? 'fail' : 'partial');
  return { cls, text: it.score + '/' + it.max };
}
function isFlaggedItem(it){
  return !it.na && it.score !== null && it.score !== undefined && Number(it.score) < it.max;
}
function reviewItemRow(it){
  const pill = reviewPill(it);
  const photos = reviewPhotos[it.id] || [];
  let photoHtml = '';
  if(photos.length){
    photoHtml = `<div class="photo-strip">${photos.map((p, i)=>`<div class="photo-thumb readonly" style="cursor:pointer;" onclick="openReviewPhoto('${it.id}', ${i})"><img src="${p}" alt=""></div>`).join('')}</div>`;
  } else if(it.photos > 0){
    const n = it.photos + (it.photos === 1 ? ' photo' : ' photos');
    photoHtml = `<div class="rv-photo-note">${reviewPhotosState === 'loading' ? 'Loading photos…' : n + ' not available on this device'}</div>`;
  }
  return `<div class="rv-item">
    <div class="rv-main">
      <div class="rv-name">${esc(it.name)}</div>
      ${it.note ? `<div class="rv-note">${esc(it.note)}</div>` : ''}
      ${photoHtml}
    </div>
    <div class="score-pill ${pill.cls}">${pill.text}</div>
  </div>`;
}

      <div class="result-stat"><div class="result-stat-num" style="color:#3B82F6;">${na}</div><div class="result-stat-label">Not Available</div></div>
      <div class="result-stat"><div class="result-stat-num">${hasItems ? rep.items.length : cats.length}</div><div class="result-stat-label">${hasItems ? 'Items' : 'Categories'}</div></div>
    </div>
  </div>`;

  if(cats.length){
    html += `
  <div class="card">
    <h2 class="section-title">Category Breakdown</h2>
    ${cats.map(c=>`
      <div class="cat-bar-row">
        <div class="cat-bar-top"><span class="name">${esc(c.name)}</span><span class="pct">${Number(c.pct).toFixed(0)}%</span></div>

  }

  if(hasItems){
    const groups = new Map();
    rep.items.forEach(it=>{

      if(!groups.has(it.cat)) groups.set(it.cat, []);
      groups.get(it.cat).push(it);
    });
    html += `
  <div class="seg cols2" style="margin-bottom:14px;">
    <button type="button" class="seg-btn${reviewFilter === 'all' ? ' on' : ''}" onclick="setReviewFilter('all')">All items</button>
    <button type="button" class="seg-btn${reviewFilter === 'flagged' ? ' on' : ''}" onclick="setReviewFilter('flagged')">Areas for improvement</button>
  </div>`;
    if(groups.size){
      groups.forEach((arr, cat)=>{
        html += `<div class="card"><h2 class="section-title">${esc(cat)}</h2>${arr.map(reviewItemRow).join('')}</div>`;
      });
    } else {
      html += `<div class="card"><p class="empty" style="padding:8px 0;">No areas for improvement. Everything was at full score.</p></div>`;

function updateItem(catId, subId, itemId, field, val){
  if(!canEditChecklist()) return;
  const c=checklist.find(c=>c.id===catId); const s=c.subcategories.find(s=>s.id===subId); const it=s.items.find(i=>i.id===itemId);
  it[field] = val;
}
function updateItemTier(catId, subId, itemId, idx, val){
  if(!canEditChecklist()) return;
  const c=checklist.find(c=>c.id===catId); const s=c.subcategories.find(s=>s.id===subId); const it=s.items.find(i=>i.id===itemId);
  const t = itemTiers(it).slice();
  t[idx] = Number(val)||0;
  it.tiers = t;
}

function renderAudit(){
  const { catResults } = computeScores();
  const crMap = {}; catResults.forEach(c=>crMap[c.id]=c);
  const isDone = isItemAnswered;
  let totalItems = 0, reviewedItems = 0;
  checklist.forEach(c=>c.subcategories.forEach(s=>s.items.forEach(it=>{ totalItems++; if(isDone(it)) reviewedItems++; })));
  const progPct = totalItems ? (reviewedItems / totalItems * 100) : 0;
  let html = `
  <div class="store-head">
    <button class="back-chip" onclick="goStep('visit')" aria-label="Edit visit information"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 class="store-title">${esc(auditInfo.store || 'Audit')}</h2>
  </div>
  ${visitSummaryHTML(true)}
  <div class="card">
    <div class="progress-head">
      <h2 class="section-title" style="margin:0;">Score Each Item</h2>
      <span class="progress-count">${reviewedItems}/${totalItems}</span>
    </div>
    <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${progPct}%; background:var(--primary);"></div></div>
  </div>`;
  checklist.forEach(cat=>{
    const cr = crMap[cat.id] || {pct:100, weight:0};
    let catTotal = 0, catDone = 0;
    cat.subcategories.forEach(sc=>sc.items.forEach(it=>{ catTotal++; if(isDone(it)) catDone++; }));
    html += `<div class="card">
      <div class="cat-header">
        <div>
          <div class="cat-title">${esc(cat.name)}</div>
        </div>
        <div class="weight-chip">${cr.pct.toFixed(0)}%</div>
      </div>`;
    cat.subcategories.forEach(sc=>{
      html += `<div class="subcat"><div class="subcat-name">${esc(sc.name)}</div>`;
      sc.items.forEach(it=>{
        const t = itemTiers(it);
        const photos = it.photos || [];
        const scored = it.score !== null && it.score !== undefined;
        const answered = isItemAnswered(it);
        const isMissing = !answered && showMissing;
        let pillClass = isMissing ? 'missing' : 'unscored', pillText = isMissing ? 'Required' : 'Select';
        if(it.na){
          pillClass = 'na'; pillText = 'N/A';
        } else if(scored){
          pillText = `${it.score}/${t[0]}`;
          pillClass = Number(it.score) >= t[0] ? 'full' : (Number(it.score) <= t[t.length-1] ? 'fail' : 'partial');
        }
        html += `<div class="item-tap-row${isMissing ? ' missing' : ''}" onclick="openScoreModal('${it.id}')">
          <div class="item-tap-main">
            <div class="item-tap-name">${esc(it.name)}</div>
            <div class="item-tap-meta">
              ${it.na? `<span class="meta-chip">Not Available</span>` : ''}
              ${it.note? `<span class="meta-chip">✎ Note</span>` : ''}
              ${photos.length? `<span class="meta-chip">Photos (${photos.length})</span>` : ''}
            </div>
          </div>
          <div class="score-pill ${pillClass}">${pillText}</div>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary btn-block" onclick="goStep('report')">Complete</button></div>`;
  return html;
}

/* Photos: resize/compress client-side before storing so PDFs stay a reasonable size */
function resizeImageFile(file, maxDim=1000, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=h*maxDim/w; w=maxDim; } }
        else { if(h>maxDim){ w=w*maxDim/h; h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(w); canvas.height = Math.round(h);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), w: canvas.width, h: canvas.height });
      };
      img.onerror = ()=>reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
async function handlePhotoSelect(itemId, event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const it = findItem(itemId); if(!it) return;
  const statusEl = document.getElementById('photostatus-'+itemId);
  if(statusEl) statusEl.innerHTML = `<div class="photo-uploading">Processing ${files.length} photo(s)…</div>`;
  it.photos = it.photos || [];
  try{
    const results = await Promise.all(files.map(f=>resizeImageFile(f)));
    it.photos.push(...results);
  }catch(err){
    alert('One or more photos could not be processed: ' + err.message);
  }
  event.target.value = '';
  if(activeModalItemId === itemId) renderModal(); else renderAuditPartial();
}

function barColor(pct){ if(pct>=90) return 'var(--pass)'; if(pct>=85) return 'var(--warn)'; return 'var(--fail)'; }

function gaugeSVG(pct){
  const clamped = Math.min(100, Math.max(0, pct));
  const r = 74;
  const circumference = 2 * Math.PI * r;
  const dash = (clamped/100) * circumference;
  const col = barColor(clamped);
  return `<svg width="180" height="180" viewBox="0 0 180 180">
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--border)" stroke-width="14"/>
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"
      transform="rotate(-90 90 90)"/>
  </svg>`;
}

/* Signature pad */
let sigCtx=null, sigDrawing=false, sigHasDrawn=false;
function initSigPad(){
  const canvas = document.getElementById('sigPad'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle='#152420';
  sigCtx = ctx; sigHasDrawn=false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx * canvas.width/r.width, y: cy * canvas.height/r.height };
  }
  function start(e){ sigDrawing=true; sigHasDrawn=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ sigDrawing=false; }
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
function clearSig(){ const c=document.getElementById('sigPad'); const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); sigHasDrawn=false; }

/* Phones (and the home-screen app) block the old "doc.save()" download, so the PDF is built as a file
   and handed over through a small "PDF ready" window: Save (share sheet / download) or Open. */
let pdfReady = null;   // { blob, url, name }

function imageSize(dataUrl){
  return new Promise(resolve=>{
    const im = new Image();
    im.onload = ()=>resolve({ w: im.naturalWidth || 4, h: im.naturalHeight || 3 });
    im.onerror = ()=>resolve({ w: 4, h: 3 });
    im.src = dataUrl;
  });
}
function pdfFileName(d){
  const clean = v => String(v || '').trim().replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '');
  return 'Audit-' + (clean(d.store) || 'Store') + '-' + (clean(d.date) || 'report') + '.pdf';
}
/* category rows of a saved report (old reports did not keep points, so work them out from the items) */
function catRowsFromReport(rep){
  const items = Array.isArray(rep.items) ? rep.items : [];
  return (rep.categories || []).map(c=>{
    let scored = null, max = null;
    if(items.length){
      scored = 0; max = 0;
      items.forEach(it=>{
        if(it.cat !== c.name || it.na) return;
        if(it.score !== null && it.score !== undefined){ max += it.max; scored += Number(it.score) || 0; }
      });
    }
    if(typeof c.scored === 'number'){ scored = c.scored; max = c.max; }
    return { name:c.name, weight:Number(c.weight) || 0, pct:Number(c.pct) || 0, scored, max };
  });
}

async function pdfDataFromReport(rep){

  const items = Array.isArray(rep.items) ? rep.items : [];

    notAvailable = items.filter(it=>it.na).map(it=>({ cat:it.cat, name:it.name, note:it.note || '' }));
  } else {

/* draws the PDF from a data object and returns the jsPDF document */
function renderPDF(d){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const rating = ratingFor(d.score);
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 50;

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(18,56,99);
  doc.text('Audit Report', margin, y);
  doc.setFontSize(24); doc.setTextColor(31,95,168);
  doc.text(d.score.toFixed(1)+'%', pageW-margin, y, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120,120,120);
  doc.text('Overall weighted score', pageW-margin, y+14, {align:'right'});

  y += 24;
  doc.setDrawColor(220,229,225); doc.line(margin, y, pageW-margin, y);
  y += 20;

  doc.setFontSize(10.5); doc.setTextColor(60,70,66);
  const info = [
    ['Store', d.store || '-'],
    ['Auditor', d.auditor || '-'],
    ['Date', d.date || '-'],
    ['Rating', rating.label],
    ['Time In', d.timeIn || '-'],
    ['Time Out', d.timeOut || '-'],
    ['Traffic', d.traffic || '-'],
    ['Weather', d.weather || '-'],
  ];
  info.forEach((row,i)=>{
    const col = i % 2, line = Math.floor(i/2);
    doc.setFont('helvetica','bold'); doc.text(row[0]+':', margin + col*260, y + line*16);
    doc.setFont('helvetica','normal'); doc.text(String(row[1]), margin + col*260 + 60, y + line*16);
  });
  y += Math.ceil(info.length/2)*16 + 16;

  doc.autoTable({
    startY: y,
    margin: { left: margin, right: margin },
    head: [['Category', 'Weight %', 'Score', 'Max', '% Achieved']],
    body: d.categories.map(c=>[c.name, c.weight.toFixed(1)+'%', c.scored == null ? '-' : c.scored, c.max == null ? '-' : c.max, c.pct.toFixed(1)+'%']),
    headStyles: { fillColor:[31,95,168], fontSize:9.5 },
    bodyStyles: { fontSize:9.5 },
    theme: 'grid'
  });
  y = doc.lastAutoTable.finalY + 24;

  const flaggedItems = d.flagged;
  const notAvailableItems = d.notAvailable.map(n=>[n.cat, n.name, n.note || '']);

  if(y > 680){ doc.addPage(); y = 50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(18,56,99);
  doc.text('Areas for Improvement', margin, y);
  y += 10;

  if(flaggedItems.length===0){
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(80,80,80);
    doc.text('No areas for improvement recorded.', margin, y+16);
    y += 30;
  } else {
    doc.autoTable({
      startY: y+8,
      margin: { left: margin, right: margin },
      head: [['Category', 'Item', 'Score', 'Note']],
      body: flaggedItems.map(f=>[f.cat, f.name, f.score+'/'+f.max, f.note]),
      headStyles: { fillColor:[192,57,43], fontSize:9 },
      bodyStyles: { fontSize:9 },
      theme: 'grid'
    });
    y = doc.lastAutoTable.finalY + 24;
  }

  if(notAvailableItems.length){
    if(y > 680){ doc.addPage(); y = 50; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(18,56,99);
    doc.text('Not Available ('+notAvailableItems.length+')', margin, y);
    y += 10;
    doc.autoTable({
      startY: y+8,
      margin: { left: margin, right: margin },
      head: [['Category', 'Item', 'Note']],
      body: notAvailableItems,
      headStyles: { fillColor:[101,82,166], fontSize:9 },
      bodyStyles: { fontSize:9 },
      theme: 'grid'
    });
    y = doc.lastAutoTable.finalY + 24;
  }

  const itemsWithPhotos = flaggedItems.filter(f=>f.photos && f.photos.length);
  if(itemsWithPhotos.length){
    if(y > 660){ doc.addPage(); y = 50; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(18,56,99);
    doc.text('Photo Evidence', margin, y);
    y += 18;
    const boxW = 140, boxMaxH = 105, gap = 12;
    const pageBottom = 780;
    itemsWithPhotos.forEach(entry=>{
      if(y > pageBottom - 30){ doc.addPage(); y = 50; }
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(50,60,56);
      doc.text(`${entry.name}  (${entry.cat})`, margin, y);
      y += 8;
      let x = margin, rowMaxH = 0;
      entry.photos.forEach(p=>{
        const ratio = p.w / p.h;
        let w = boxW, h = boxW / ratio;
        if(h > boxMaxH){ h = boxMaxH; w = boxMaxH * ratio; }
        if(x + w > pageW - margin){ x = margin; y += rowMaxH + 10; rowMaxH = 0; }
        if(y + h > pageBottom){ doc.addPage(); y = 50; x = margin; rowMaxH = 0; }
        doc.addImage(p.dataUrl, 'JPEG', x, y, w, h);
        x += w + gap;
        rowMaxH = Math.max(rowMaxH, h);
      });
      y += rowMaxH + 20;
    });
    y += 4;
  }

  doc.setFontSize(8.5); doc.setTextColor(150,150,150);
  doc.text('Generated ' + d.generatedAt.toLocaleString(), margin, 812);
  return doc;
}

/* ---- the "PDF ready" window ---- */
function pdfModal(inner){
  const root = document.getElementById('pdfModalRoot');
  if(!root) return;
  root.innerHTML = inner ? `
  <div class="modal-overlay" onclick="if(event.target===this) closePdfModal()">
    <div class="modal-sheet" style="position:relative; text-align:center;">
      <div class="modal-handle"></div>
      ${inner}
    </div>
  </div>` : '';
}
function closePdfModal(){ pdfModal(''); }
function showPdfBusy(){
  pdfModal(`<div class="modal-title" style="padding-right:0;">Preparing PDF…</div><div class="modal-sub" style="margin-bottom:6px;">This only takes a moment.</div>`);
}
function showPdfError(err){
  console.warn('PDF failed:', err);
  pdfModal(`<div class="modal-title" style="padding-right:0;">Could not make the PDF</div>
    <div class="modal-sub" style="margin-bottom:18px;">${esc((err && err.message) || 'Please try again.')}</div>
    <button class="btn btn-outline btn-block" onclick="closePdfModal()">Close</button>`);
}
function isPhoneLike(){
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) || navigator.standalone;
  const touch = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  return !!(standalone || touch);
}
function triggerDownload(){
  if(!pdfReady) return;
  const a = document.createElement('a');
  a.href = pdfReady.url; a.download = pdfReady.name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* share sheet (phones) -> 'shared' | 'cancelled' | 'failed' */
async function shareSavePdf(){
  if(!pdfReady) return 'failed';
  try{
    const file = new File([pdfReady.blob], pdfReady.name, { type:'application/pdf' });
    if(isPhoneLike() && navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: pdfReady.name });
      return 'shared';
    }
  }catch(err){
    if(err && err.name === 'AbortError') return 'cancelled';
  }
  return 'failed';
}
/* only used if the phone blocked the automatic save */
async function savePdf(){
  const r = await shareSavePdf();
  if(r === 'failed') triggerDownload();
}
function pdfReadyModal(needsManualSave){
  pdfModal(`
    <div class="done-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="modal-title" style="padding-right:0;">Done</div>
    <div class="modal-sub pdf-file">${esc(pdfReady ? pdfReady.name : '')}</div>
    ${needsManualSave ? `<button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="savePdf()">Save PDF</button>` : ''}
    <button class="btn ${needsManualSave ? 'btn-outline' : 'btn-primary'} btn-block" onclick="closePdfModal()">Close</button>`);
}
async function deliverPDF(doc, name){
  if(pdfReady && pdfReady.url){ try{ URL.revokeObjectURL(pdfReady.url); }catch(err){} }
  const blob = doc.output('blob');
  pdfReady = { blob, url: URL.createObjectURL(blob), name };
  pdfReadyModal(false);
  if(!isPhoneLike()){ triggerDownload(); return; }          // computers: download starts by itself
  const r = await shareSavePdf();                            // phones: opens Save to Files / share sheet
  if(r === 'failed') pdfReadyModal(true);                    // blocked by the phone: show one Save button
}
function pdfToolReady(){
  if(window.jspdf && window.jspdf.jsPDF) return true;
  alert('The PDF tool did not load. Please check your internet connection and try again.');
  return false;
}
