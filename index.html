  if(st){
    st.textContent = saved.ok ? 'Report saved to ' + auditInfo.store + '.' : 'Not saved: ' + saved.msg;
    st.style.color = saved.ok ? 'var(--pass)' : 'var(--fail)';
  }
  showPdfBusy();
  setTimeout(()=>{
    try{
      const data = pdfDataFromCurrent();
      deliverPDF(renderPDF(data), pdfFileName(data));
    }catch(err){ showPdfError(err); }
  }, 30);
}
/* PDF of any saved report (from the report list or the review page) */
async function downloadReportPDF(id){
  const rep = reports.find(r=>r.id === id);
  if(!rep) return;
  if(!pdfToolReady()) return;
  showPdfBusy();
  try{
    const data = await pdfDataFromReport(rep);
    deliverPDF(renderPDF(data), pdfFileName(data));
  }catch(err){ showPdfError(err); }
}

/* ---------------- UTIL ---------------- */
function esc(s){ return String(s==null? '' : s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- MAIN RENDER ---------------- */
function render(){
  if(step==='review' && !reports.some(r=>r.id === activeReportId)) step = 'profile';
  const nav = document.getElementById('stepNav');
  const content = document.getElementById('content');
  const sub = document.getElementById('headerSub');
  const menuBtn = document.getElementById('menuBtn');

  if(!loggedInUser){
    nav.innerHTML = '';
    sub.textContent = '';
    content.innerHTML = renderLogin();
    if(menuBtn) menuBtn.style.display = 'none';
    return;
  }
  if(menuBtn) menuBtn.style.display = '';

  renderNav();
  if(step==='visit') content.innerHTML = renderVisit();
  else if(step==='review') content.innerHTML = renderReview();
  else if(step==='manage') content.innerHTML = renderManage();
  else if(step==='edit') content.innerHTML = renderEdit();
  else if(step==='audit') content.innerHTML = renderAudit();
  else if(step==='report'){ content.innerHTML = renderReport(); setTimeout(initSigPad, 30); }
  else if(step==='settings') content.innerHTML = renderSettings();
  else if(step==='profile') content.innerHTML = renderProfile();

  if(menuBtn){
    if(step === 'settings'){
      menuBtn.innerHTML = '←';
      menuBtn.style.fontSize = '18px';
      menuBtn.style.color = '#fff';
    } else {
      menuBtn.innerHTML = '<span></span><span></span><span></span>';
      menuBtn.style.fontSize = '';
    }
  }
}
loadAccountsFromStorage();
loadReportsFromStorage();
loadStoresFromStorage();
loadAdminProfile();
loadSession();
</script>
<script>
/* ============ AUTO-SAVE (checklist + audit in progress) ============ */
(function(){
  const TPL_KEY='qc_checklist_template_v1', DRAFT_KEY='qc_audit_draft_v1';
  let timer=null, toastTimer=null;

  function who(){ return loggedInUser ? (loggedInUser.accountId || loggedInUser.username || '') : ''; }
  function toast(){}
  function stripTemplate(){
    return checklist.map(c=>({...c, subcategories:c.subcategories.map(sc=>({...sc, items:sc.items.map(it=>{
      const {score,note,na,photos,...rest}=it; return {...rest, score:null, note:'', na:false};
    })}))}));
  }
  function answers(){
    const a={};
    checklist.forEach(c=>c.subcategories.forEach(sc=>sc.items.forEach(it=>{
      if((it.score!==null && it.score!==undefined) || it.na || it.note) a[it.id]={score:it.score, na:!!it.na, note:it.note||''};
    })));
    return a;
  }
  let lastBlob='';
  function save(quiet){
    try{
      if(!loggedInUser) return;
      const tpl=JSON.stringify(stripTemplate());
      const a=answers();
      let draft=null;
      if(Object.keys(a).length || auditInfo.store){
        draft=JSON.stringify({user:who(), auditInfo, answers:a, step:(['visit','audit','report'].includes(step)?step:null)});
      }
      const blob=tpl+'|'+(draft||'');
      const changed = blob!==lastBlob; lastBlob=blob;
      localStorage.setItem(TPL_KEY, tpl);
      if(draft) localStorage.setItem(DRAFT_KEY, draft); else localStorage.removeItem(DRAFT_KEY);
      if(!quiet && changed) toast();
    }catch(e){ console.warn('Auto-save failed', e); }
  }
  window.scheduleAutoSave=function(quiet){ clearTimeout(timer); timer=setTimeout(()=>save(quiet),600); };
  window.clearAuditDraft=function(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} };

  function restore(){
    try{
      const tpl=JSON.parse(localStorage.getItem(TPL_KEY)||'null');
      if(Array.isArray(tpl) && tpl.length) checklist=tpl;
      const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
      if(d && loggedInUser && d.user===who()){
        Object.assign(auditInfo, d.auditInfo||{});
        checklist.forEach(c=>c.subcategories.forEach(sc=>sc.items.forEach(it=>{
          const a=d.answers && d.answers[it.id]; if(a){ it.score=a.score; it.na=a.na; it.note=a.note; }
        })));
        if(d.step && ['visit','audit','report'].includes(d.step)) step=d.step;
      }
    }catch(e){ console.warn('Restore failed', e); }
  }

  /* ring + number count-up */
  function animateGauges(){
    document.querySelectorAll('.gauge-ring-wrap').forEach(w=>{
      const c=w.querySelectorAll('circle')[1];
      if(c && !c.dataset.done){
        const final=c.getAttribute('stroke-dasharray'); const parts=final.split(' ');
        c.dataset.done='1'; c.setAttribute('stroke-dasharray','0 '+parts[1]);
        requestAnimationFrame(()=>requestAnimationFrame(()=>c.setAttribute('stroke-dasharray',final)));
      }
    });
    document.querySelectorAll('.gauge-score').forEach(el=>{
      if(el.dataset.done) return; el.dataset.done='1';
      const target=parseFloat(el.textContent);
      if(isNaN(target) || !el.firstChild || el.firstChild.nodeType!==3) return;
      const start=performance.now();
      (function tick(now){
        const p=Math.min(1,(now-start)/900), e=1-Math.pow(1-p,3);
        el.firstChild.nodeValue=(target*e).toFixed(1);
        if(p<1) requestAnimationFrame(tick);
      })(start);
    });
  }

  /* save after every render, tap, key press, and when the app is closed */
  const _render=render;
  render=function(){
    _render.apply(this,arguments);
    window.scheduleAutoSave();
    requestAnimationFrame(animateGauges);
  };
  const _save=saveCurrentReport;
  saveCurrentReport=function(){ const r=_save.apply(this,arguments); if(r && r.ok){ clearAuditDraft(); lastBlob=''; } return r; };
  ['input','change','click'].forEach(ev=>document.addEventListener(ev,()=>window.scheduleAutoSave(),true));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(true); });
  window.addEventListener('pagehide',()=>save(true));

  restore();
  render();
})();

/* ============ Full screen / installable app ============ */
(function(){
  try{
    const icon=document.querySelector('link[rel="icon"]').href;
    const base=location.href.split('#')[0].split('?')[0];
    const m={name:'Audit',short_name:'Audit',display:'fullscreen',display_override:['fullscreen','standalone'],
      orientation:'portrait',start_url:base,scope:base.replace(/[^\/]*$/,''),
      background_color:'#12143A',theme_color:'#12143A',icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const l=document.createElement('link'); l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
  const standalone=window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone;
  if(!standalone && window.matchMedia('(pointer:coarse)').matches){
    const go=()=>{ const el=document.documentElement; if(el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen({navigationUI:'hide'}).catch(()=>{}); document.removeEventListener('click',go,true); };
    document.addEventListener('click',go,true);
  }
})();
</script>
